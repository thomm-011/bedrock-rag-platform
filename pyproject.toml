[project]
name = "bedrock-rag-platform"
dynamic = ["version"]
description = "Production-shaped RAG platform: local Ollama+pgvector today, Bedrock-ready interfaces for tomorrow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thomas Silva Cordeiro" }]
keywords = ["rag", "fastapi", "pgvector", "ollama", "bedrock", "llm", "retrieval-augmented-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pypdf>=5.0",
  "typer>=0.13",
  "python-multipart>=0.0.12",
]

[project.urls]
Homepage = "https://github.com/thomm-011/bedrock-rag-platform"
Repository = "https://github.com/thomm-011/bedrock-rag-platform"
Issues = "https://github.com/thomm-011/bedrock-rag-platform/issues"
Changelog = "https://github.com/thomm-011/bedrock-rag-platform/blob/main/CHANGELOG.md"

[project.scripts]
rag = "bedrock_rag_platform.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bedrock_rag_platform/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_rag_platform"]

[tool.hatch.build.targets.sdist]
include = ["src", "scripts", "eval", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pre-commit>=4.0",
  "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["bedrock_rag_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a real pgvector Postgres instance (see Makefile target)",
]

[tool.coverage.run]
source = ["src/bedrock_rag_platform"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
